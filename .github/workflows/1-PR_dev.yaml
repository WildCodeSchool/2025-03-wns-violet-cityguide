name: Exécution des tests unitaires et d'intégration

on:
  pull_request:
    branches: 
      - develop
    types: [opened, reopened, synchronize]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        # Action de récupération du code pré-existante fournie par GHub Actions
        uses: actions/checkout@v4

      - name: Exécution tests front-end
        run: cd frontend && npm i && npm run test

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toto
          POSTGRES_PASSWORD: toto
          POSTGRES_DB: city_guide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U toto -d city_guide_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USER: toto
      TEST_DB_PASSWORD: toto
      TEST_DB_NAME: city_guide_test
      JWT_SECRET: secret

    steps:
      - name: Récupération du code
        # Action de récupération du code pré-existante fournie par GHub Actions
        uses: actions/checkout@v4

      - name: Exécution tests back-end
        run: cd backend && npm i && npm run test
